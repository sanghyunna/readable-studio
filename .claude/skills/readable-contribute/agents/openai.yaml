# Codex CLI sidecar (optional). Adds a friendlier picker entry when this skill
# is loaded by Codex from ~/.agents/skills/readable-contribute/ or .agents/skills/.
# Not required — Codex loads SKILL.md regardless.

interface:
  display_name: "Readable Studio — Contribute"
  short_description: "Ship a Skill / Design System / translation / typo fix to sanghyunna/readable-studio without writing code."
  default_prompt: "I want to contribute to Readable Studio."

policy:
  # Allow Codex to surface this skill when the user mentions Readable Studio contribution
  # without an explicit `$readable-contribute` invocation. Keep on — it's the whole point.
  allow_implicit_invocation: true
