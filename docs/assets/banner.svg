<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 800" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Readable Studio hero banner placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7EF"/>
      <stop offset="100%" stop-color="#EFE7D7"/>
    </linearGradient>
  </defs>
  <rect width="2400" height="800" fill="url(#bg)"/>
  <rect x="32" y="32" width="2336" height="736" rx="28" ry="28"
    fill="none" stroke="#C2532D" stroke-width="3" stroke-dasharray="16 12" opacity="0.85"/>
  <!--
    Readable Studio brand mark, reused verbatim from the mark geometry in
    apps/web/public/brand-icon.svg so this banner stays consistent with the
    favicon / app icon / packaged desktop icon.

    The source artwork is authored on a 48x48 grid; it is placed here with a
    uniform 6x scale (48 -> 288) and centred on the 2400x800 canvas. Only the
    transform is new — every path coordinate, stroke width, cap and colour is
    the untouched icon geometry, so the two assets cannot drift apart.

    Deliberately NOT copied from the icon: the white rounded-rectangle plate
    and its 0.92 inset group transform. Those exist so the app icon reads as a
    product tile on arbitrary OS chrome; this banner already has its own cream
    background, so the mark sits on it directly. Copy the mark geometry here,
    never the plate.
  -->
  <g transform="translate(1056 150) scale(6)">
    <path
      d="M37.3 6.76H10.43A4.9 4.9 0 0 0 5.53 11.66V36.27A4.9 4.9 0 0 0 10.43 41.17H37.53A4.9 4.9 0 0 0 42.43 36.27V20.46"
      stroke="#343a40" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <g stroke-width="3.18" stroke-linecap="round">
      <line x1="14.99" y1="17.11" x2="32.98" y2="17.11" stroke="#2563eb" />
      <line x1="14.99" y1="24.4" x2="28.1" y2="24.4" stroke="#343a40" />
      <line x1="14.99" y1="31.2" x2="23.22" y2="31.2" stroke="#343a40" />
    </g>
  </g>
  <text x="1200" y="530" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="72" font-weight="700" letter-spacing="2" fill="#343a40">
    Readable Studio
  </text>
  <text x="1200" y="592" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="26" fill="#6B6258">
    docs/assets/banner.svg
  </text>
  <text x="1200" y="656" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="24" fill="#6B6258">
    Replace with a wide product screenshot or marketing illustration.
  </text>
  <text x="1200" y="744" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="20" letter-spacing="4" fill="#6B6258" opacity="0.85">
    SCREENSHOT PENDING · 截图占位
  </text>
</svg>
